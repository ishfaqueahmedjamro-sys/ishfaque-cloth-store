<!DOCTYPE html>
<html>
<head>
    <title>Ishfaque Cloth Store</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: black;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .product {
            background: white;
            margin: 15px;
            padding: 15px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }
        .product img {
            width: 100%;
            border-radius: 10px;
        }
        button {
            background-color: black;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: orange;
        }
    </style>
</head>
<body>

<header>
    <h1>Ishfaque Cloth Store</h1>
    <p>Best Quality Clothes</p>
</header>

<div class="container">
    <div class="product">
        <img src="https://via.placeholder.com/250" alt="Shirt">
        <h3>Stylish Shirt</h3>
        <p>Price: Rs 1500</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250" alt="Jeans">
        <h3>Blue Jeans</h3>
        <p>Price: Rs 2500</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250" alt="Suit">
        <h3>Formal Suit</h3>
        <p>Price: Rs 5000</p>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
